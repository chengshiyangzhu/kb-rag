[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-rag"
version = "0.1.0"
description = "Enterprise RAG knowledge base (kb-rag)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "qdrant-client>=1.9",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2.10",
    "rank-bm25>=0.2.2",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "rapidocr-onnxruntime>=1.3.24",
    "beautifulsoup4>=4.12",
    "markdown>=3.6",
    "tiktoken>=0.7",
    "openai>=1.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",
    "ragas>=0.1.9",
    "streamlit>=1.35",
    "tenacity>=8.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
]

[project.scripts]
kb-rag-api = "backend.main:run"

[tool.setuptools.packages.find]
include = ["app*", "backend*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
